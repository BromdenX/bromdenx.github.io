# Site identity
title: BromdenX
SEOTitle: BromdenX | AI Systems, Networks, and Field Notes
header-img: img/post-bg-desk.jpg
description: "Practical notes on AI agents, network systems, and the work of building."
keyword: "BromdenX,AI agents,Personal AI OS,network systems,engineering notes"
url: "https://bromdenx.github.io"
baseurl: ""
github_repo: "https://github.com/BromdenX/bromdenx.github.io"
timezone: Asia/Shanghai

# Sidebar
sidebar: true
sidebar-about-description: "Engineer working across AI agents, personal systems, and network infrastructure."
